<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Mood-Based Food Recommendation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,sans-serif;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
padding:24px;
}
.container{width:100%;max-width:760px}
.card{
background:rgba(255,255,255,.1);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.18);
border-radius:24px;
padding:42px;
box-shadow:0 20px 60px rgba(0,0,0,.35);
color:#fff;
text-align:center;
}
h1{margin:0 0 12px;font-size:2.3rem}
p{color:#dbeafe;line-height:1.7;margin-bottom:28px}
input{
width:100%;
padding:16px 18px;
border:none;
border-radius:14px;
font-size:1rem;
margin-bottom:18px;
outline:none;
}
button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:1rem;
font-weight:700;
cursor:pointer;
background:#22c55e;
color:#fff;
transition:.25s;
}
button:hover{transform:translateY(-2px)}
.badges{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:22px;
}
.badges span{
padding:8px 14px;
background:rgba(255,255,255,.12);
border-radius:999px;
font-size:.9rem;
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>🥗 AI Mood-Based Food Recommendation</h1>
<p>Tell us how you're feeling, and our AI will recommend foods that match your mood and energy level.</p>

<div class="badges">
<span>⚡ Instant</span>
<span>🥦 Healthy</span>
<span>🧠 Mood Aware</span>
</div>

<form action="/predict" method="POST">
<input type="text" name="mood" placeholder="Example: I'm feeling stressed after work..." required>
<button type="submit">Get Recommendations ✨</button>
</form>
</div>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
